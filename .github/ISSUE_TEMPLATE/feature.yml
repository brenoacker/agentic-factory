name: Feature
description: New feature in a target repository (feature workflow -> tlc-spec-lean v2.2.0)
title: "[feature] "
labels: ["type:feature", "stage:triage"]
body:
  - type: input
    id: project
    attributes:
      label: Target Repository
      description: Repository where the change will be implemented (owner/repo)
      placeholder: brenoacker/agentic-factory
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / Objective
      description: What needs to exist and why
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance Criteria
      description: Observable behaviors with concrete values whenever possible
      placeholder: "- WHEN X happens THEN the system SHALL Y"
  - type: textarea
    id: context
    attributes:
      label: Context & References
      description: Links, binding screenshots, or prior architectural decisions
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime Override (optional)
      options: ["factory default", "antigravity", "claude-code", "codex"]
      default: 0

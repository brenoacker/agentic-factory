name: Discovery
description: Broad idea or new project (discovery workflow -> PRD / design doc -> feature slices)
title: "[discovery] "
labels: ["type:discovery", "stage:triage"]
body:
  - type: input
    id: project
    attributes:
      label: Target Repository
      description: Existing repository or "new"
      placeholder: brenoacker/agentic-factory
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea / Situation
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: Success Criteria
  - type: textarea
    id: constraints
    attributes:
      label: Known Constraints

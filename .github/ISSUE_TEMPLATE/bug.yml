name: Bug
description: Defeito num projeto-alvo (workflow bug → reproduzir, teste de regressão, correção)
title: "[bug] "
labels: ["type:bug", "stage:triage"]
body:
  - type: input
    id: project
    attributes:
      label: Projeto-alvo
      placeholder: brenoacker/meu-projeto
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportamento atual
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Passos para reproduzir
      placeholder: "1. ...\n2. ..."
  - type: textarea
    id: evidence
    attributes:
      label: Evidências
      description: Logs, stack trace, link do Sentry, prints
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime (opcional)
      options: ["padrão da fábrica", "antigravity", "claude-code", "codex"]
      default: 0

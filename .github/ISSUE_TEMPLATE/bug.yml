name: Bug
description: Software defect in a target repository (bug workflow -> reproduce, regression test first, fix)
title: "[bug] "
labels: ["type:bug", "stage:triage"]
body:
  - type: input
    id: project
    attributes:
      label: Target Repository
      placeholder: brenoacker/agentic-factory
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      placeholder: "1. ...\n2. ..."
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, stack traces, Sentry link, or screenshots
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime Override (optional)
      options: ["factory default", "antigravity", "claude-code", "codex"]
      default: 0

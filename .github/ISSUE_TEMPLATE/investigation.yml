name: Investigation
description: Technical question or spike (investigation workflow -> report + follow-up tickets, no code PR)
title: "[investigation] "
labels: ["type:investigation", "stage:triage"]
body:
  - type: input
    id: project
    attributes:
      label: Target Repository
      placeholder: brenoacker/agentic-factory
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question to Answer
      description: What needs to be investigated and proven
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Definition of Done
      description: E.g. root cause with file/line evidence, option comparison, impact estimate
  - type: textarea
    id: context
    attributes:
      label: Context & Leads

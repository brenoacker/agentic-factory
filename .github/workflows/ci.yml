name: Factory CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies and Playwright Chromium
        run: npm ci && npx playwright install --with-deps chromium
      - name: Verify locked TLC skills and v2 requirement
        run: node scripts/sync-skills.mjs --verify-only
      - name: Validate factory.yaml, workflows, and contract schemas
        run: node packages/core/cli.mjs validate
      - name: Run unit tests
        run: node --test scripts/__test__/skills-sync.test.mjs packages/core/__test__/factory-core.test.mjs packages/core/__test__/runtime-loop.test.mjs packages/core/__test__/pipeline.test.mjs apps/panel/__test__/control-panel.test.mjs
      - name: Run Playwright visual, component, integration, and E2E tests
        run: npx playwright test --reporter=list
      - name: Run tlc-spec-lean v2.2.0 self-test
        run: python3 skills/vendor/tlc-spec-lean/scripts/selftest.py

# Factory as Code configuration (YAML 1.2 JSON-compatible subset)
{
  "schemaVersion": 1,
  "factory": {
    "name": "agentic-factory",
    "repo": "brenoacker/agentic-factory",
    "defaultRuntime": "antigravity",
    "autonomy": "gated",
    "killSwitch": false,
    "pollIntervalSeconds": 90,
    "limits": {
      "maxTasksPerHour": 10,
      "maxReviewRounds": 3,
      "dailyBudgetUsd": 25,
      "stageTimeoutMinutes": 30,
      "stallThresholdMinutes": 30,
      "minPlanConfidence": 0.8,
      "requirePlanApproval": false
    },
    "modelByImpact": {
      "low": {
        "runtime": "antigravity",
        "model": "gemini-flash"
      },
      "medium": {
        "runtime": "antigravity",
        "model": "claude-sonnet"
      },
      "high": {
        "runtime": "antigravity",
        "model": "claude-opus"
      }
    },
    "runtimes": {
      "antigravity": {
        "enabled": true,
        "cli": "agy"
      },
      "claude-code": {
        "enabled": true,
        "cli": "claude"
      },
      "codex": {
        "enabled": true,
        "cli": "codex"
      }
    },
    "projects": [
      {
        "id": "agentic-factory",
        "repo": "brenoacker/agentic-factory",
        "defaultBranch": "main",
        "paused": false
      },
      {
        "id": "incident-investigator",
        "repo": "brenoacker/incident-investigator",
        "provider": "github",
        "defaultBranch": "main",
        "paused": false
      },
      {
        "id": "linear-agentic-factory",
        "repo": "linear://brenoack/agentic-factory-80f4e9bb2ce1",
        "provider": "linear",
        "defaultBranch": "main",
        "paused": false,
        "trackerConfig": {
          "projectKey": "agentic-factory-80f4e9bb2ce1",
          "statuses": "Todo,Backlog,In Progress"
        }
      }
    ]
  }
}
